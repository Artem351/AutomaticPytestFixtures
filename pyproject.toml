[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-stands"
version = "0.1.0"
description = "Подготовка тестового стенда и последовательный запуск тестов pytest по YAML"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pytest>=8", "pydantic>=2", "PyYAML>=6"]

[project.entry-points.pytest11]
pytest_stands = "pytest_stands.plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
